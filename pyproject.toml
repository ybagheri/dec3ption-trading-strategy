[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "dec3ption"
version = "0.2.0"
description = "Dec3ption Group-II trading strategy engine (MT5)"
requires-python = ">=3.11"
dependencies = [
    "MetaTrader5>=5.0.45",
    "python-dotenv>=1.0.0",
    "pandas>=2.0.0",
    "numpy>=1.26.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
